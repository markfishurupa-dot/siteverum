<!doctype html>
<html lang="en" data-view="published">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreetView survey</title>
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
<script defer src="/static/vendor/leaflet.js"></script>
<script defer src="/static/viewer.js"></script>
<script defer src="/static/published.js"></script>
</head>
<body>
<header><h1 id="title">StreetView survey</h1><span>Local survey map</span></header>
<section class="published">
<p id="message" role="status"></p>
<div id="results" hidden>
  <div class="viewer">
    <div id="map" aria-label="Survey map"></div>
    <figure>
      <img id="photo" alt="Survey photograph">
      <figcaption id="caption"></figcaption>
      <button id="previous">Previous photo</button>
      <button id="next">Next photo</button>
      <a id="download-photo" download>Download photo</a>
    </figure>
  </div>
</div>
</section>
</body>
</html>
