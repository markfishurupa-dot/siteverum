name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q services
      - run: python -m unittest discover -s tests -v
      - run: node --check apps/web/app.js
      - run: node --check apps/web/viewer.js
      - run: node --check apps/web/published.js
