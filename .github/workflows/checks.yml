name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 numpy==2.2.6 pandas==2.3.3 pyproj==3.7.2 shapely==2.1.2 scikit-learn==1.7.2
      - run: python -m compileall -q services modules
      - run: python -m unittest discover -s tests -v
      - run: node --check apps/web/app.js
      - run: node --check apps/web/viewer.js
      - run: node --check apps/web/published.js
      - run: node --check apps/web/modules.js
      - run: node --check apps/web/module-publication.js
